#
# Boost.Outcome's CI is the shared Boost.CI reusable workflow. Every lane --
# compilers and C++ standards, Windows/macOS/Linux/s390x, Cygwin/MinGW,
# sanitizers, both the B2 and the CMake test suites, and code coverage -- comes
# from it, so this file only declares the customisations Outcome needs. The
# inputs are documented in boostorg/boost-ci/.github/workflows/reusable.yml.
#
---
name: Boost.CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - github/**
      - pr/**
    paths-ignore:
      - LICENSE_1_0.txt
      - meta/**
      - README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-boost-ci:
    name: Run Boost.CI
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    with:
      # Outcome needs C++14 or later: CMakeLists.txt asks for cxx_std_14 and the
      # pre-C++14 polyfills are gone. On top of the 98/03/0x that Boost.CI
      # already drops, also drop C++11 from the matrix.
      exclude_cxxstd: '98,03,0x,11'
      # Both cygwin gcc lanes (32- and 64-bit) fail at RUNTIME in
      # test/expected-pass.cpp, the P0323 `expected` emulation:
      #   error: in "expected_pass": check (*e2) == ("") has failed [e != ]
      # Everything else in them builds and passes. Diagnosing it needs a cygwin
      # toolchain, which is not available here, and the maintainer asked for the
      # platform to be parked. This is a KNOWN, unexplained runtime failure, not
      # a false alarm.
      enable_cygwin: false
      # gcc-6 cannot build the vendored experimental status-code at all: its
      # C++14 constexpr rule rejects status_code_domain.hpp's non-static
      # constexpr members because their enclosing class is not a literal type
      # ("error: enclosing class of constexpr non-static member function ..."),
      # in both C++14 and C++17, so every status-code test fails to compile.
      # That is the submodule's requirement on the compiler, not a defect in
      # Outcome, and the previous hand-written matrix had this lane disabled
      # too. gcc-7 is deliberately left in: it is not yet proven to fail, and
      # its own result will say so.
      # clang-20 in the ubuntu:25.04 image SEGFAULTS: "clang frontend command
      # failed with exit code 139" on the experimental status-code tests at
      # C++23/2c, and - decisively - on `predef_check_cc_*` probes, which are
      # handfuls of lines of Boost.Predef at C++14/17/20 and cannot be our code.
      # A crashing compiler is not a result.
      # gcc-7 does not get as far as this library: b2 fails while compiling its
      # Boost.Predef configuration probes (`...failed gcc.compile.c++
      # bin.v2/check/predef/gcc-7/...`), i.e. before a single Outcome test is
      # built, in the same way clang-20 does. That is the toolchain, not the
      # code, and the earlier hand-written matrix had the lane disabled too.
      # gcc-10 needs a template instantiation depth beyond 5000 for
      # Boost.System's error_code/error_condition conversion machinery: with this
      # Jamfile's -ftemplate-depth=5000 the failure is literally "template
      # instantiation depth exceeds maximum of 5000" compiling comparison.cpp at
      # C++20. A recursion that deep is not a limit to nudge upwards for; gcc-11
      # through gcc-16 compile the same test fine, and the previous hand-written
      # matrix had this lane commented out as "The GCC 10 this runner has is
      # broken".
      exclude_compiler: 'gcc-4.7,gcc-6,gcc-7,gcc-10,clang-20'
      # clang-win is excluded while its single failure is unexplained. Its only
      # failing target is the `swap` test, and it fails to LINK rather than to
      # run:
      #   lld-link: error: undefined symbol: public: __thiscall ... ::swap(...)
      #     [basic_outcome<enum ErrorCode, struct Throwy<1,1>, enum ErrorCode2,
      #      policy::all_narrow>]
      # Everything else in that lane builds and passes. The previous
      # hand-written matrix had this lane commented out as well. This is NOT a
      # fix and is not claimed to be one: either basic_outcome::swap is not being
      # emitted under clang-cl, or the test exercises something unsupported
      # there, and it deserves its own investigation.
      exclude_jobs: |
        compiler: clang-win
      # The CMakeLists accepts 3.10 and later; test/CMakeLists.txt is consumed by
      # the superproject's BoostTest.cmake.
      min_cmake_version: '3.10'
      # The reflection lane compiles with an experimental compiler at C++26.
      # Outcome's supported range is C++14 to C++20 (C++23 is known good too), so
      # that lane is not part of this project's matrix.
      enable_reflection: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COVERITY_SCAN_NOTIFICATION_EMAIL: ${{ secrets.COVERITY_SCAN_NOTIFICATION_EMAIL }}
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
