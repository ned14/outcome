#
# Boost.Outcome's CI is the shared Boost.CI reusable workflow. Every lane --
# compilers and C++ standards, Windows/macOS/Linux/s390x, Cygwin/MinGW,
# sanitizers, both the B2 and the CMake test suites, and code coverage -- comes
# from it, so this file only declares the customisations Outcome needs. The
# inputs are documented in boostorg/boost-ci/.github/workflows/reusable.yml.
#
---
name: Boost.CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - github/**
      - pr/**
    paths-ignore:
      - LICENSE_1_0.txt
      - meta/**
      - README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-boost-ci:
    name: Run Boost.CI
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    with:
      # Outcome needs C++14 or later: CMakeLists.txt asks for cxx_std_14 and the
      # pre-C++14 polyfills are gone. On top of the 98/03/0x that Boost.CI
      # already drops, also drop C++11 from the matrix.
      exclude_cxxstd: '98,03,0x,11'
      # The CMakeLists accepts 3.10 and later; test/CMakeLists.txt is consumed by
      # the superproject's BoostTest.cmake.
      min_cmake_version: '3.10'
      # The reflection lane compiles with an experimental compiler at C++26.
      # Outcome's supported range is C++14 to C++20 (C++23 is known good too), so
      # that lane is not part of this project's matrix.
      enable_reflection: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COVERITY_SCAN_NOTIFICATION_EMAIL: ${{ secrets.COVERITY_SCAN_NOTIFICATION_EMAIL }}
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
