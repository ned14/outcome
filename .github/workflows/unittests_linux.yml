name: Unit tests Linux

on:
  push:
    branches:
    - develop
    - master
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  Linux:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++-19, g++, libc++]
    env:
      NAME: Linux-${{ matrix.compiler }}
      CXX: ${{ matrix.compiler }}
          
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 0

    # CMake's ensure_git_subrepo() initialises these two only when their include
    # directories are missing, and it does so with `git submodule update --init
    # --recursive --depth 1`: a shallow fetch of a pinned commit, which git answers
    # with 128 when that pin is not the tip of the branch the shallow clone saw. The
    # run before last reported exactly that - "Fetched in submodule path
    # 'include/outcome/experimental/wg14_result', but it did not contain
    # 0048f890689a95f31b5098a554f4d0c9de00ce49" - and the direct clone it then falls
    # back to needs the network to succeed, which is a fragile thing to hang a
    # configure on. Do the update here instead, non-shallow and limited to the two
    # submodules the build reads (doc/html and the doc themes are not part of it), so
    # that configure has nothing to fetch; and if a pin really is unreachable, let
    # git say so in an annotation rather than in a configure log nobody can read.
    - name: Fetch the submodules the build reads
      shell: bash
      run: |
       set -o pipefail
       if ! git submodule update --init include/outcome/experimental/status-code include/outcome/experimental/wg14_result 2>&1 | tee submodules.log; then
         tail -5 submodules.log | sed -e 's/%/%25/g' -e 's/^/::error::git submodule update: /'
         exit 1
       fi
    
    - name: CMake tests Linux
      shell: bash
      run: |
       set -o pipefail
       if [ "${{ matrix.compiler }}" = "libc++" ]; then
         wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -;
         sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main";
         sudo apt update;
         sudo apt install clang-19 libc++-19-dev libc++abi-19-dev libomp-19-dev;
         export CMAKE_CONFIGURE_OPTIONS="-DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-linux-libc++.cmake";
         ctest -S .ci.cmake -VV -E noexcept --timeout 900 "-DCTEST_CONFIGURE_OPTIONS=$CMAKE_CONFIGURE_OPTIONS" 2>&1 | tee ci.log;
       elif [ "${{ matrix.compiler }}" = "clang++-19" ]; then
         wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -;
         sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main";
         sudo apt update;
         sudo apt install clang-19 libc++-19-dev libc++abi-19-dev libomp-19-dev;
         ctest -S .ci.cmake -VV --timeout 900 "-DCTEST_CONFIGURE_OPTIONS=$CMAKE_CONFIGURE_OPTIONS" 2>&1 | tee ci.log;
       else
         ctest -S .ci.cmake -VV --timeout 900 "-DCTEST_CONFIGURE_OPTIONS=$CMAKE_CONFIGURE_OPTIONS" 2>&1 | tee ci.log;
       fi

    # The job log lives on storage this project's own tooling cannot reach, so the
    # first errors are re-emitted as workflow commands: those become check-run
    # annotations, which are readable through the API.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        set +e
        log=ci.log
        # Check runs keep only the first ten annotations a step emits, so this is in
        # order of usefulness: the compiler, the linker and the test runner each name
        # their failure on one line, and everything else here is the noise around it
        # ("-- Performing Test ... - Failed").
        #
        # The compiler pattern has to carry MSVC's spelling too - "error C2338: ...",
        # "error LNK2019: ..." - which puts a space and a code between the word and
        # the colon, so plain 'error:' never matched it. That is why the Windows job
        # has been arriving with no compiler diagnostic in it: the only MSVC error it
        # ever reported (a failed static_assert in cabi-layout.cpp) came through the
        # older sweep solely because that sweep still contained a bare 'FAILED', which
        # 'static_assert failed' satisfies case-insensitively, and this step dropped
        # 'FAILED' when the '-- Performing Test ... - Failed' noise was removed.
        if [ -f "$log" ]; then
          emit() { sed -e 's/%/%25/g' -e 's/\r$//' | sed 's/^/::error::/'; }
          {
            # The test run's own verdict comes first. CTest answers "-1" rather than a
            # count when any test was "Not Run" - one whose executable was never built,
            # or whose REQUIRED_FILES is not there - and it names that test in its
            # summary alone. With the cap at ten lines, a single compile-fail test's
            # -VV output fills it on its own and the verdict never arrives: that is why
            # the Windows lane reported "-1" and nothing else.
            # Our own one-line list of the tests which did not pass comes first, on
            # its own, because it is the one line that says which test to go and look
            # at; ctest's summary spells the same thing out over several lines.
            grep -iE 'NOT PASSED' "$log" | head -2
            grep -iE 'not run|unable to find executable|tests failed out of|The following tests FAILED|% tests passed' "$log" | head -3
            # Then the compiler, the linker, the test runner.
            grep -iE 'error:|error C[0-9]{3,4}:|error LNK[0-9]{4}|LNK[0-9]{4}|unresolved external|undefined (reference|symbol)|fatal error' "$log" | head -3
            # Then what a ctest script was doing when it failed: CMake prints the
            # cause on the lines after its error line ("Unknown CMake command ...",
            # "FATAL: build of _hl failed ..."), so its body is taken, not its head.
            grep -iE -A4 'CMake Error' "$log" | grep -viE '^--$|^-- Performing Test|CMake(Error|Output)\.log' | head -3
            # A failure matching none of the above still has to arrive with the last
            # thing that happened in it.
            tail -1 "$log"
          } | awk '!seen[$0]++' | head -10 | emit
        else
          echo "::error::$log was never written: the failing step never reached tee(1), so there is nothing to annotate"
        fi

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      with:
        name: Linux ${{ matrix.compiler }} test results
        path: prebuilt/merged_junit_results.xml

  # C++14 is quickcpplib's opt-in compatibility mode (Outcome sets
  # QUICKCPPLIB_MIN_CXX_STANDARD=14 for it). A mode nobody continuously builds is
  # how the old pmr emulation rotted, so build the whole suite at C++14 here.
  Linux-CXX14:
    name: Ubuntu 22.04 (C++14 opt-in)
    runs-on: ubuntu-22.04
    env:
      NAME: Linux-g++-cxx14
      CXX: g++
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 0

    # CMake's ensure_git_subrepo() initialises these two only when their include
    # directories are missing, and it does so with `git submodule update --init
    # --recursive --depth 1`: a shallow fetch of a pinned commit, which git answers
    # with 128 when that pin is not the tip of the branch the shallow clone saw. The
    # run before last reported exactly that - "Fetched in submodule path
    # 'include/outcome/experimental/wg14_result', but it did not contain
    # 0048f890689a95f31b5098a554f4d0c9de00ce49" - and the direct clone it then falls
    # back to needs the network to succeed, which is a fragile thing to hang a
    # configure on. Do the update here instead, non-shallow and limited to the two
    # submodules the build reads (doc/html and the doc themes are not part of it), so
    # that configure has nothing to fetch; and if a pin really is unreachable, let
    # git say so in an annotation rather than in a configure log nobody can read.
    - name: Fetch the submodules the build reads
      shell: bash
      run: |
       set -o pipefail
       if ! git submodule update --init include/outcome/experimental/status-code include/outcome/experimental/wg14_result 2>&1 | tee submodules.log; then
         tail -5 submodules.log | sed -e 's/%/%25/g' -e 's/^/::error::git submodule update: /'
         exit 1
       fi

    - name: CMake tests Linux (C++14)
      shell: bash
      run: |
        set -o pipefail
        ctest -S .ci.cmake -VV --timeout 900 "-DCTEST_CONFIGURE_OPTIONS=-DCMAKE_CXX_STANDARD=14" 2>&1 | tee ci.log

    # The job log lives on storage this project's own tooling cannot reach, so the
    # first errors are re-emitted as workflow commands: those become check-run
    # annotations, which are readable through the API.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        set +e
        log=ci.log
        # Check runs keep only the first ten annotations a step emits, so this is in
        # order of usefulness: the compiler, the linker and the test runner each name
        # their failure on one line, and everything else here is the noise around it
        # ("-- Performing Test ... - Failed").
        #
        # The compiler pattern has to carry MSVC's spelling too - "error C2338: ...",
        # "error LNK2019: ..." - which puts a space and a code between the word and
        # the colon, so plain 'error:' never matched it. That is why the Windows job
        # has been arriving with no compiler diagnostic in it: the only MSVC error it
        # ever reported (a failed static_assert in cabi-layout.cpp) came through the
        # older sweep solely because that sweep still contained a bare 'FAILED', which
        # 'static_assert failed' satisfies case-insensitively, and this step dropped
        # 'FAILED' when the '-- Performing Test ... - Failed' noise was removed.
        if [ -f "$log" ]; then
          emit() { sed -e 's/%/%25/g' -e 's/\r$//' | sed 's/^/::error::/'; }
          {
            # The test run's own verdict comes first. CTest answers "-1" rather than a
            # count when any test was "Not Run" - one whose executable was never built,
            # or whose REQUIRED_FILES is not there - and it names that test in its
            # summary alone. With the cap at ten lines, a single compile-fail test's
            # -VV output fills it on its own and the verdict never arrives: that is why
            # the Windows lane reported "-1" and nothing else.
            # Our own one-line list of the tests which did not pass comes first, on
            # its own, because it is the one line that says which test to go and look
            # at; ctest's summary spells the same thing out over several lines.
            grep -iE 'NOT PASSED' "$log" | head -2
            grep -iE 'not run|unable to find executable|tests failed out of|The following tests FAILED|% tests passed' "$log" | head -3
            # Then the compiler, the linker, the test runner.
            grep -iE 'error:|error C[0-9]{3,4}:|error LNK[0-9]{4}|LNK[0-9]{4}|unresolved external|undefined (reference|symbol)|fatal error' "$log" | head -3
            # Then what a ctest script was doing when it failed: CMake prints the
            # cause on the lines after its error line ("Unknown CMake command ...",
            # "FATAL: build of _hl failed ..."), so its body is taken, not its head.
            grep -iE -A4 'CMake Error' "$log" | grep -viE '^--$|^-- Performing Test|CMake(Error|Output)\.log' | head -3
            # A failure matching none of the above still has to arrive with the last
            # thing that happened in it.
            tail -1 "$log"
          } | awk '!seen[$0]++' | head -10 | emit
        else
          echo "::error::$log was never written: the failing step never reached tee(1), so there is nothing to annotate"
        fi
  # A 32-bit lane, added because there was none: #325 was a 16-byte ABI shape
  # asserted over two intptr_t fields, which is 8 bytes wherever pointers are 4,
  # so the whole unit-test target failed to compile on every 32-bit target and
  # nothing noticed - every lane built where intptr_t is 8 bytes. Keep this lane
  # cheap and ordinary: it is the target class that is unusual, not the build.
  Linux-32bit:
    name: Ubuntu 22.04 (32-bit -m32)
    runs-on: ubuntu-22.04
    env:
      NAME: Linux-g++-32bit
      CXX: g++
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Fetch the submodules the build reads
      shell: bash
      run: |
       set -o pipefail
       if ! git submodule update --init include/outcome/experimental/status-code include/outcome/experimental/wg14_result 2>&1 | tee submodules.log; then
         tail -5 submodules.log | sed -e 's/%/%25/g' -e 's/^/::error::git submodule update: /'
         exit 1
       fi

    # g++-multilib is what makes -m32 linkable at all: it brings the 32-bit
    # libstdc++ and libgcc, without which the configure succeeds and every link
    # fails with a 64-bit archive. The runner is x86_64 and its kernel runs
    # 32-bit binaries natively, so nothing else is needed - no i386 container.
    - name: Install the 32-bit multilib toolchain
      shell: bash
      run: |
        set -o pipefail
        sudo apt-get update
        sudo apt-get install -y g++-multilib

    - name: CMake tests Linux (32-bit)
      shell: bash
      run: |
        set -o pipefail
        ctest -S .ci.cmake -VV --timeout 900 "-DCTEST_CONFIGURE_OPTIONS=-DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-linux-32bit.cmake" 2>&1 | tee ci.log

    # This lane builds the C++ side of the WG14 ABI (test/tests/cabi-layout.cpp,
    # which pins the C++ result against the C struct). The pure C compilation of
    # the same header lives in the wg14_result submodule, whose test tree this
    # repository does not build - so compile it here, with the same -m32, or the C
    # half of a dual-language ABI is the half with no 32-bit coverage. The header
    # has already shipped one 32-bit-only defect that only a `-m32` build could
    # see, so both languages are exercised rather than the one CMake happens to
    # give us. The standards probed are the ones the submodule's own CMakeLists
    # uses, including C23 only where the compiler has it.
    - name: Compile and run the WG14 layout matrix as C, 32-bit
      shell: bash
      run: |
        set -o pipefail
        inc=include/outcome/experimental/wg14_result/include
        src=include/outcome/experimental/wg14_result/test/layout_test.c
        for std in c11 c17 c2x; do
          if ! gcc -m32 -std=$std -fsyntax-only -x c /dev/null 2>/dev/null; then
            echo "$std is not a mode this gcc has; skipped" | tee -a wg14-c32.log
            continue
          fi
          gcc -m32 -std=$std -Wall -Wextra -Wpedantic -I "$inc" "$src" \
            -o "layout_test_$std" 2>&1 | tee -a wg14-c32.log
          "./layout_test_$std" 2>&1 | tee -a wg14-c32.log
        done
        g++ -m32 -std=c++11 -Wall -Wextra -Wpedantic -I "$inc" \
          include/outcome/experimental/wg14_result/test/layout_test_cxx.cpp \
          -o layout_test_cxx11_32 2>&1 | tee -a wg14-c32.log
        ./layout_test_cxx11_32 2>&1 | tee -a wg14-c32.log

    # The job log lives on storage this project's own tooling cannot reach, so the
    # first errors are re-emitted as workflow commands: those become check-run
    # annotations, which are readable through the API.
    - name: Annotate the errors
      if: failure()
      shell: bash
      run: |
        set +e
        for log in ci.log wg14-c32.log; do
        if [ -f "$log" ]; then
          emit() { sed -e 's/%/%25/g' -e 's/\r$//' | sed 's/^/::error::/'; }
          {
            grep -iE 'NOT PASSED' "$log" | head -2
            grep -iE 'not run|unable to find executable|tests failed out of|The following tests FAILED|% tests passed' "$log" | head -3
            grep -iE 'error:|error C[0-9]{3,4}:|error LNK[0-9]{4}|LNK[0-9]{4}|unresolved external|undefined (reference|symbol)|fatal error|static assertion failed' "$log" | head -3
            grep -iE -A4 'CMake Error' "$log" | grep -viE '^--$|^-- Performing Test|CMake(Error|Output)\.log' | head -3
            tail -1 "$log"
          } | awk '!seen[$0]++' | head -10 | emit
        else
          echo "::error::$log was never written: the failing step never reached tee(1), so there is nothing to annotate"
        fi
        done

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      with:
        name: Linux 32-bit test results
        path: prebuilt/merged_junit_results.xml

  publish-test-results:
    name: "Publish Unit Tests Results"
    needs: [Linux, Linux-32bit]
    runs-on: ubuntu-latest
    if: success() || failure()

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit Test Results
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: '**/merged_junit_results.xml'
